# OpenOCD config for LiteX JTAGBone on the YPCB XC7K480T board via Digilent HS3.

adapter driver ftdi
adapter speed 1000
transport select jtag

ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi serial 210299BF3824
ftdi layout_init 0x00e8 0x60eb

reset_config none

source [find cpld/xilinx-xc7.cfg]
source [find cpld/jtagspi.cfg]

proc fpga_program {} {
    global _CHIPNAME
    xc7_program $_CHIPNAME.tap
}
